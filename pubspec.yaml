
name: figma2
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  pandabar: ^0.1.2
  flutter_staggered_grid_view: ^0.7.0
  google_sign_in: 5.4.4

  # Firebase
  cloud_firestore: 5.6.12
  firebase_core: 3.15.2
  firebase_auth: 5.7.0

  # UI and Storage
  flutter_easyloading: ^3.0.5
  get_storage: ^2.1.1

  # Image Picker
  image_picker: ^1.1.2

  # Supabase
  supabase_flutter: 2.9.0

  # Google Maps and Location
  google_maps_flutter: 2.10.0
  geolocator: 13.0.4

  # SVG
  flutter_svg: 2.0.17

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 5.0.0

dependency_overrides:
  win32: 5.10.1
  flutter_plugin_android_lifecycle: 2.0.35
  path_provider_android: 2.2.15
  path_provider: 2.1.5

flutter:
  uses-material-design: true

  assets:
    - assets/
